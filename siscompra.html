<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Sistema de Compras</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1a2332;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --success-bg: #064e3b;
      --warning: #f59e0b;
      --warning-bg: #78350f;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    .topbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .topbar-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-size: 12px;
      color: var(--text-secondary);
      display: block;
    }

    .main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s;
    }

    .stat:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .stat-value.total {
      color: var(--accent);
    }

    .stat-value.comprados {
      color: var(--success);
    }

    .stat-value.pendentes {
      color: var(--warning);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
    }

    .panel-body {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-add {
      background: var(--accent);
      color: white;
      height: 38px;
    }

    .btn-add:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-finish {
      background: var(--success);
      color: white;
    }

    .btn-finish:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-edit {
      background: var(--warning);
      color: #1f2937;
      padding: 6px 10px;
      font-size: 12px;
      margin-right: 6px;
    }

    .btn-edit:hover {
      background: #d97706;
    }

    .btn-delete {
      background: var(--danger);
      color: white;
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-delete:hover {
      background: var(--danger-hover);
    }

    .btn-cancel {
      background: var(--border);
      color: var(--text-primary);
    }

    .btn-cancel:hover {
      background: #475569;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(59, 130, 246, 0.05);
    }

    .product-name {
      font-weight: 600;
    }

    .product-price {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .badge-completed {
      background: var(--success-bg);
      color: var(--success);
    }

    .subtotal {
      font-weight: 600;
    }

    .footer-total {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
    }

    .footer-total .total-label {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .footer-total .total-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      padding: 25px;
    }

    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .topbar-content {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-content">
      <div class="logo">
        <div class="logo-icon">🛒</div>
        <div>
          <h1>Pedidos</h1>
          <span>Gestão de Compras</span>
        </div>
      </div>
      <div style="color: var(--text-secondary); font-size: 13px;">
        Atualizado em tempo real
      </div>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat">
        <div class="stat-value total" id="stat-total">0</div>
        <div class="stat-label">Total de Itens</div>
      </div>
      <div class="stat">
        <div class="stat-value comprados" id="stat-comprados">0</div>
        <div class="stat-label">Comprados</div>
      </div>
      <div class="stat">
        <div class="stat-value pendentes" id="stat-pendentes">0</div>
        <div class="stat-label">Pendentes</div>
      </div>
      <div class="stat">
        <div class="stat-value total" id="stat-valor">R$ 0</div>
        <div class="stat-label">Valor Pendente</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        ➕ Adicionar Produto
      </div>
      <div class="panel-body">
        <form id="form-produto">
          <div class="form-grid">
            <div class="field">
              <label>Nome do Produto</label>
              <input type="text" id="produto-nome" placeholder="Ex: Arroz, Feijão..." required>
            </div>
            <div class="field">
              <label>Preço (R$)</label>
              <input type="number" id="produto-preco" placeholder="0.00" step="0.01" min="0.01" required>
            </div>
            <div class="field">
              <label>Quantidade</label>
              <input type="number" id="produto-quantidade" placeholder="1" min="1" required>
            </div>
            <button type="submit" class="btn btn-add">Adicionar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        📋 Lista de Produtos
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Preço Unit.</th>
              <th>Subtotal</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos"></tbody>
        </table>
      </div>
      <div class="footer-total">
        <span class="total-label">Total Pendente</span>
        <span class="total-value" id="valor-total">R$ 0,00</span>
      </div>
      <div style="padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
        <button class="btn btn-finish" onclick="finalizarCompra()">✓ Finalizar Compra</button>
      </div>
    </div>
  </div>

  <!-- Modal de Edição -->
  <div class="modal" id="modal-edicao">
    <div class="modal-content">
      <div class="modal-header">✏️ Editar Produto</div>
      <form id="form-edicao">
        <input type="hidden" id="edicao-index">
        <div class="field" style="margin-bottom: 12px;">
          <label>Nome do Produto</label>
          <input type="text" id="edicao-nome" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
          <div class="field">
            <label>Preço (R$)</label>
            <input type="number" id="edicao-preco" step="0.01" min="0.01" required>
          </div>
          <div class="field">
            <label>Quantidade</label>
            <input type="number" id="edicao-quantidade" min="1" required>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn-add">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="siscompra.js"></script>
</body>
</html>
